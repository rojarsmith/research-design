# Route table for the public API. The most specific pattern wins (see README).
#      method  pattern                    upstream
route  GET     /                          web
route  GET     /health                    health
route  GET     /users                     users
route  POST    /users                     signup
route  GET     /users/me                  profile
route  GET     /users/:id                 users
route  DELETE  /users/:id                 users-admin
route  ANY     /users/:id/orders          orders
route  GET     /users/:id/orders/:order   orders
route  GET     /files/*path               files
route  PUT     /files/*path               files-upload
route  GET     /docs/*page                docs
route  GET     /docs/api/:version         docs-api
